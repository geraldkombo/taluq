[package]
name = "taluq"
version = "0.1.0"
description = "Taluq Smart Contracts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "taluq"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022", "associated_token", "mint"] }
switchboard-solana = "0.30.4"
